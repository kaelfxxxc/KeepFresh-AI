# Supabase configuration for KeepFresh AI.
# Used by `supabase start` (local dev) and `supabase functions deploy`.
#
# Security note: functions triggered by the app (recipe-suggestions,
# weekly-summary) require a signed-in user's access token. The scheduled
# function (expiration-notifier) is invoked by pg_cron / a Supabase cron trigger
# with the anon key, so it does NOT require a JWT.

project_id = "keepfresh-ai"

[functions.expiration-notifier]
verify_jwt = false

# Generates recipes from the caller's own inventory and writes them to `recipes`.
# Requires a JWT: the inventory it reads and the rows it writes both belong to one
# user, and one AI scan is metered against that user's plan per generation.
# Holds GEMINI_API_KEY, which never reaches the app. Photographs come from
# TheMealDB (no key) and, when configured, PEXELS_API_KEY.
[functions.recipe-suggestions]
verify_jwt = true

[functions.weekly-summary]
verify_jwt = true

[functions.barcode-lookup]
verify_jwt = true

# Photo identification. Requires a JWT for the same reason barcode-lookup does:
# the call is metered against the caller's plan, and the meter reads the user
# from the forwarded token rather than from the request body.
[functions.food-vision]
verify_jwt = true

# Purchase verification. Must never be reachable without a signed-in user: it is
# the only path that can activate a paid plan, and it identifies the buyer from
# the caller's own access token.
[functions.subscription-verify]
verify_jwt = true

# Creates a PayMongo Checkout Session and returns the hosted page URL. Requires a
# JWT for the same reason subscription-verify does: the attempt is recorded
# against the caller, and the amount is read from the plan in the database rather
# than accepted from the request.
# Holds PAYMONGO_SECRET_KEY, which never reaches the app.
[functions.paymongo-checkout]
verify_jwt = true

# "Has my checkout been paid?" — the app asking after the hosted page closes, so
# a payment that has cleared does not have to wait on the webhook. Requires a
# JWT: it confirms the session belongs to the caller before asking PayMongo.
[functions.paymongo-verify]
verify_jwt = true

# PayMongo's own notification that a checkout was paid. NO JWT, and that is
# deliberate — PayMongo calls this from their infrastructure and cannot present a
# Supabase token. Authenticity comes from the `Paymongo-Signature` header
# instead: a hex HMAC-SHA256 of the raw body, keyed with PAYMONGO_WEBHOOK_SECRET
# and compared in constant time before the body is parsed. That check is the only
# thing standing between this endpoint and the internet, which is why it runs
# first and refuses to process anything when the secret is unset.
[functions.paymongo-webhook]
verify_jwt = false
